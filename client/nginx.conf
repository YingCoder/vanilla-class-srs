server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the React bundle and any audio / image assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml audio/mpeg;

    # Proxy API requests to the Express server
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        # Required for SSE (assignment progress streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all non-file routes serve index.html.
    # index.html must never be cached, or students keep an old client after a
    # deploy; hashed assets can be cached for a year.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(?:js|css|woff2|png|ico|svg|mp3|m4a)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
